# CI — build, lint, test, and audit on every push.
#
# release.yml builds artefacts but runs no tests and checks no advisories. The
# Control-Center 1.1.0 regression (sessions reporting "active" while recording
# nothing) shipped because nothing ran the suite; three certificate-validation
# advisories sat open for the same reason. This workflow is the gate for both.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, lint and test
    runs-on: ubuntu-24.04

    # ma-core/src/registry/mod.rs connects to a real Redis; the registry unit
    # tests fail without one.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 'stable'
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # rdkafka-sys vendors librdkafka and compiles it from C, so the headers
      # must be present or the build fails on curl/curl.h. Mirrors release.yml.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev pkg-config libcurl4-openssl-dev

      # ma-proto/build.rs calls tonic_build::compile_protos() at compile time and
      # src/gen/ is gitignored, so a clean checkout must regenerate it.
      - name: Install protoc
        run: |
          curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-linux-x86_64.zip -o /tmp/protoc.zip
          unzip -o /tmp/protoc.zip -d /usr/local bin/protoc
          chmod +x /usr/local/bin/protoc

      - name: Build
        run: cargo build --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # ma-app must be installed, not just pytest: test_scaffolder.py imports the
      # package, which pulls rich/typer with it.
      - name: Python tests
        run: |
          python3 -m pip install --upgrade pip pytest
          python3 -m pip install ./ma-app
          python3 -m pytest ma-app/tests -q

  audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04

    # audit-check publishes its findings as a check run, which the default
    # read-only token cannot create.
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      # Fails the build on any advisory. Two of the three found in 0.2.0 were
      # certificate-validation bypasses on the path that verifies the
      # Control-Center server certificate, so this gate is not advisory-only.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Opt-in: downloads every published Control-Center release archive and takes
  # several minutes, so it does not gate every push. Run it before cutting a
  # release, or after any change to the capture stream. Each archive supplies
  # both a server and an agent; the record-fidelity cases need the agent, since
  # `agent_version` does not exist on the wire until one registers.
  #
  # No xdotool here on purpose. The agent registers and idles without it, and
  # nothing in this job actuates — a matrix that needed a display would not be
  # runnable in CI at all.
  compatibility:
    name: Control-Center compatibility matrix
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 'stable'

      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        # redis-tools supplies redis-cli, which conftest.py uses to decide the
        # registry is reachable. Without it every test in this job was marked
        # skip and the matrix reported success having run nothing.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev pkg-config libcurl4-openssl-dev redis-tools

      - name: Install protoc
        run: |
          curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-linux-x86_64.zip -o /tmp/protoc.zip
          unzip -o /tmp/protoc.zip -d /usr/local bin/protoc
          chmod +x /usr/local/bin/protoc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build ma-core and install the CLI
        run: |
          cargo build -p ma-core --locked
          python3 -m pip install --upgrade pip pytest
          python3 -m pip install ./ma-app

      - name: Stage Control-Center releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash integration-tests/stage-cc-releases.sh

      - name: Compatibility matrix
        # MA_INTEGRATION_STRICT turns an unmet prerequisite into a failure. The
        # skip-instead-of-fail default exists for developers who have not staged
        # the Control-Center releases; in CI it hid a gate that ran nothing.
        # -rs prints the reason for any skip that does survive.
        env:
          MA_INTEGRATION_STRICT: '1'
        run: python3 -m pytest integration-tests -q -rs
