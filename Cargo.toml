[workspace]
members = [
    "ma-core",
    "ma-proto",
    "ma-kafka-producer",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2024"
authors = ["Kartik (NullVoider)"]
license = "Apache-2.0"

# Shared dependency versions across the workspace
[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["json"] }

# Kafka
rdkafka = { version = "0.36", features = ["tokio", "cmake-build", "ssl"] }

# Observability
prometheus-client = "0.23"
tracing-appender = "0.2"

# Storage
async-trait = "0.1"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"

# TLS
rcgen = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
time = "0.3"
tokio-rustls = "0.26"

# cloud providers
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
# This is aws-sdk-s3's own default feature list minus "rustls". Do not restore
# default features.
#
# "rustls" selects the legacy hyper-0.14 connector via
# aws-smithy-runtime/tls-rustls -> aws-smithy-http-client/legacy-rustls-ring,
# which pulls rustls 0.21 and with it rustls-webpki 0.101.7 — three open
# advisories, two of them certificate-validation bypasses (RUSTSEC-2026-0099,
# -0098) and one a reachable panic (RUSTSEC-2026-0104). Nothing here uses that
# connector: S3Backend builds its client through aws_config::defaults, which is
# the "default-https-client" path below (rustls-aws-lc -> rustls 0.23).
aws-sdk-s3 = { version = "1.112.0", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
regex = "1"
google-cloud-storage = "1.7"
bytes = "1"

# gRPC + protobuf
# "tls" is not a default feature; ClientTlsConfig is needed to reach a
# Control-Center 1.1.0+ server, which refuses plaintext. "tls-roots" pulls in the
# system trust store for the case where the server certificate is publicly signed.
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image processing
image = "0.25"
imageproc = "0.25"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }